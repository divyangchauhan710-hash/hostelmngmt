services:
  # ── Single web service: Express serves both API + React frontend ────────────
  - type: web
    name: hostelhub
    runtime: node
    # Build both frontend (Vite) then backend (tsc)
    buildCommand: >
      npm install --prefix frontend &&
      npm run build --prefix frontend &&
      npm install --prefix backend &&
      npm run build --prefix backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health
